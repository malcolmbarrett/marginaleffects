name: r-check

on:
  push:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"
  _R_CHECK_TESTS_NLINES_: 0
  R_NOT_CRAN: "true"
  R_GH: "true"
  GITHUB_PAT: ${{ secrets.GITHUB_PAT }}

jobs:
  check-r:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # The r-causal dev dependencies (balancing, causalgenerics, propensity)
      # are not on CRAN yet, so the standard installers cannot satisfy the
      # Suggests floors on their own. On Linux, scrutin's r2u path runs first,
      # then the three packages are reinstalled from the r-causal universe
      # because bspm matches apt packages by name and would otherwise keep the
      # older CRAN releases.
      - uses: vincentarelbundock/scrutin/.github/actions/install_r@main
        if: runner.os == 'Linux'
        with:
          packages: any::rcmdcheck
          working-directory: r

      - name: Install r-causal dev packages
        if: runner.os == 'Linux'
        run: |
          sudo Rscript -e '
            if (requireNamespace("bspm", quietly = TRUE)) bspm::disable()
            bin <- sprintf(
              "https://r-causal.r-universe.dev/bin/linux/%s/%s.%s",
              system("lsb_release -cs", intern = TRUE),
              R.version$major,
              sub("[.].*", "", R.version$minor)
            )
            install.packages(
              c("balancing", "causalgenerics", "propensity"),
              repos = c(bin, "https://r-causal.r-universe.dev")
            )
          '

      # On macOS and Windows, these are the same steps scrutin's install_r
      # runs, with extra-repositories added so pak can resolve the r-causal
      # dev dependencies.
      - uses: r-lib/actions/setup-pandoc@v2
        if: runner.os != 'Linux'

      - uses: r-lib/actions/setup-r@v2
        if: runner.os != 'Linux'
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: https://r-causal.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: runner.os != 'Linux'
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: r

      - uses: r-lib/actions/setup-tinytex@v2
        if: runner.os != 'Linux'

      - uses: vincentarelbundock/scrutin/.github/actions/check_r@main
        with:
          working-directory: r

      # - uses: vincentarelbundock/scrutin/.github/actions/install_tools@main
      #   with:
      #     tools: jarl

      - uses: vincentarelbundock/scrutin/.github/actions/install_scrutin@main

      - run: scrutin -r github -s filter.group=cheap -s run.tool=tinytest
      # - run: scrutin -r github -s run.tool=jarl
